#name: ESRGAN_SRx4_DF2KOST_official
name: SOAGAN
model_type: ESRGANModel
scale: 4
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

datasets:
  test_1:  # the 1st test dataset
    name: Set5
    type: PairedImageDataset
    dataroot_gt: datasets/Set5/GTmod12
    dataroot_lq: datasets/Set5/LRbicx4
    io_backend:
      type: disk
  test_2:  # the 2st test dataset
    name: Set14
    type: PairedImageDataset
    dataroot_gt: datasets/Set14/GTmod12
    dataroot_lq: datasets/Set14/LRbicx4
    io_backend:
      type: disk
  test_3: # the 3st test dataset
    name: BSDS100
    type: PairedImageDataset
    dataroot_gt: datasets/BSDS100/GTmod12
    dataroot_lq: datasets/BSDS100/LRbicx4
    io_backend:
      type: disk
  test_4: # the 4st test dataset
    name: Urban100
    type: PairedImageDataset
    dataroot_gt: datasets/Urban100/GTmod12
    dataroot_lq: datasets/Urban100/LRbicx4
    io_backend:
      type: disk
  test_5: # the 5st test dataset
    name: Manga109
    type: PairedImageDataset
    dataroot_gt: datasets/Manga109/GTmod12
    dataroot_lq: datasets/Manga109/LRbicx4
    io_backend:
      type: disk
